<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Touch Grass</title>
<style>
  :root {
    --bg:       #0d1a08;
    --panel:    #141f0e;
    --panel2:   #1a2a12;
    --border:   #2c4420;
    --text:     #d0e8c0;
    --muted:    #7a9a68;
    --green:    #5ab84a;
    --ltgreen:  #88d468;
    --gold:     #c8a030;
    --brown:    #7a5530;
    --sky:      #3a7aaa;
    --tab-bg:   #0f1a09;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .hdr-title {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--ltgreen);
    white-space: nowrap;
  }

  .hdr-stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .hdr-stat { font-size: 0.8rem; }
  .hdr-stat .val { color: var(--gold); font-weight: bold; }
  .hdr-stat .lbl { color: var(--muted); }

  /* ── Main layout: left touch area + right tabbed panel ── */
  .main {
    display: grid;
    grid-template-columns: 300px 1fr;
    overflow: hidden;
  }

  /* ── Left: touch panel ── */
  .touch-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    border-right: 2px solid var(--border);
    gap: 14px;
    overflow-y: auto;
  }

  .grass-scene {
    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .grass-ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: linear-gradient(to bottom, #3a6e28, #2a4e1a);
    border-radius: 0 0 12px 12px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 4px;
    font-size: 1.4rem;
    letter-spacing: -4px;
    overflow: hidden;
  }

  #touch-btn {
    position: absolute;
    bottom: 42px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 90px;
    line-height: 1;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 4px 12px #0008);
    transition: transform 0.08s;
    z-index: 1;
  }
  #touch-btn:active { transform: translateY(6px) scale(0.95); }
  #touch-btn.squish { animation: squish 0.18s ease-out; }
  @keyframes squish {
    0%   { transform: translateY(6px) scale(0.95); }
    55%  { transform: translateY(-8px) scale(1.06); }
    100% { transform: translateY(0)   scale(1.00); }
  }

  .touch-hint {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }

  /* ── Stats box ── */
  .stats-box {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .stats-box h3 {
    font-size: 0.8rem;
    color: var(--ltgreen);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
  }
  .stat-row .lbl { color: var(--muted); }
  .stat-row .val { color: var(--gold); }

  /* ── Right: tabbed panel ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tab-bar {
    display: flex;
    background: var(--tab-bg);
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
  }

  .tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: bold;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--ltgreen);
    border-bottom-color: var(--ltgreen);
  }

  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .tab-content.active { display: flex; }

  /* ── Location cards ── */
  .location-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    display: grid;
    grid-template-columns: 2.2rem 1fr auto;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s;
  }
  .location-card.affordable { border-color: var(--green); }

  .loc-icon { font-size: 1.6rem; text-align: center; }

  .loc-info .name  { font-size: 0.88rem; font-weight: bold; }
  .loc-info .desc  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .loc-info .owned { font-size: 0.72rem; color: var(--gold); margin-top: 2px; }
  .loc-info .tps   { font-size: 0.7rem;  color: #5a8a4a; }

  .loc-buy {
    background: #1e3a14;
    border: 1px solid var(--green);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 11px;
    cursor: pointer;
    font-size: 0.78rem;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
    text-align: center;
  }
  .loc-buy:hover:not(:disabled) { background: var(--green); color: #0a140a; }
  .loc-buy:disabled { opacity: 0.38; cursor: not-allowed; }

  /* ── Skill cards ── */
  .skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .skill-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.2s, opacity 0.2s;
  }
  .skill-card.affordable { border-color: var(--green); }
  .skill-card.maxed      { opacity: 0.45; }

  .skill-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .skill-icon { font-size: 1.3rem; }
  .skill-name { font-size: 0.83rem; font-weight: bold; line-height: 1.2; }

  .skill-desc  { font-size: 0.7rem; color: var(--muted); }
  .skill-level { font-size: 0.7rem; color: var(--gold); }

  .skill-pip-row {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
  }
  .pip {
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--border);
  }
  .pip.filled { background: var(--ltgreen); }

  .skill-btn {
    background: #1e3a14;
    border: 1px solid var(--green);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    font-size: 0.75rem;
    transition: background 0.15s;
    white-space: nowrap;
    align-self: flex-start;
  }
  .skill-btn:hover:not(:disabled) { background: var(--green); color: #0a140a; }
  .skill-btn:disabled { opacity: 0.38; cursor: not-allowed; }

  /* ── Floating touch labels ── */
  .float {
    position: fixed;
    font-size: 0.95rem;
    color: var(--ltgreen);
    font-weight: bold;
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 999;
    white-space: nowrap;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
  }

  /* ── Grass blade particles ── */
  .grass-particle {
    position: fixed;
    font-size: 0.95rem;
    pointer-events: none;
    z-index: 998;
    animation: bladeAway 1.3s ease-out forwards;
  }
  @keyframes bladeAway {
    0%   { opacity: 0.9; transform: translate(0, 0) rotate(0deg) scale(1); }
    100% { opacity: 0;   transform: translate(var(--drift, 0px), -65px) rotate(var(--spin, 20deg)) scale(0.5); }
  }

  /* ── Milestone toast ── */
  #milestone-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel2);
    border: 2px solid var(--ltgreen);
    border-radius: 12px;
    padding: 12px 28px;
    font-size: 0.88rem;
    color: var(--gold);
    opacity: 0;
    transition: opacity 0.35s;
    z-index: 1000;
    text-align: center;
    pointer-events: none;
    box-shadow: 0 4px 24px #00000080;
  }
  #milestone-toast.show { opacity: 1; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="hdr-title">🌿 Touch Grass</div>
  <div class="hdr-stats">
    <div class="hdr-stat"><span class="val" id="hdr-grass">0</span> <span class="lbl">grass</span></div>
    <div class="hdr-stat"><span class="val" id="hdr-total">0</span> <span class="lbl">total touched</span></div>
    <div class="hdr-stat"><span class="val" id="hdr-tps">0</span> <span class="lbl">/sec</span></div>
    <div class="hdr-stat"><span class="val" id="hdr-tpc">1</span> <span class="lbl">/touch</span></div>
  </div>
</header>

<div class="main">

  <!-- Left: touch area -->
  <div class="touch-panel">

    <div class="grass-scene">
      <div class="grass-ground">🌿🌱🌾🌱🌿🌱🌾</div>
      <button id="touch-btn" title="Touch the grass!">🖐️</button>
    </div>

    <div class="touch-hint">touch the grass</div>

    <div class="stats-box">
      <h3>📊 Stats</h3>
      <div class="stat-row"><span class="lbl">Flat bonus/touch</span><span class="val" id="m-bonus">+0</span></div>
      <div class="stat-row"><span class="lbl">Global ×</span><span class="val" id="m-global">×1.00</span></div>
      <div class="stat-row"><span class="lbl">Location ×</span><span class="val" id="m-loc">×1.00</span></div>
      <div class="stat-row"><span class="lbl">Grass/sec</span><span class="val" id="m-tps">0.0</span></div>
    </div>

  </div>

  <!-- Right: tabs -->
  <div class="right-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="locations">📍 Locations</button>
      <button class="tab-btn"        data-tab="skills">🎒 Skills</button>
    </div>

    <div class="tab-content active" id="tab-locations"></div>
    <div class="tab-content"        id="tab-skills">
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </div>

</div>

<div id="milestone-toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const state = {
  grass: 0,
  totalGrass: 0,
  clickBonus: 0,
  globalMult: 1,
  locMult: 1,        // fps-only multiplier from skills
  buildings: {},
  upgrades: {},
};

// ─── Locations (buildings) ────────────────────────────────────────────────────
const LOCATIONS = [
  { id: 'lawn',     icon: '🏡', name: 'Front Lawn',     baseCost: 10,    baseTps: 0.1,  desc: 'Your own backyard. A humble start.' },
  { id: 'park',     icon: '🌳', name: 'Local Park',     baseCost: 80,    baseTps: 0.5,  desc: 'A short walk. Freshly mowed.' },
  { id: 'trail',    icon: '🥾', name: 'Nature Trail',   baseCost: 500,   baseTps: 3,    desc: 'A proper hike through tall grass.' },
  { id: 'meadow',   icon: '🌾', name: 'Open Meadow',    baseCost: 3000,  baseTps: 15,   desc: 'Rolling hills as far as you can see.' },
  { id: 'forest',   icon: '🌲', name: 'Deep Forest',    baseCost: 20000, baseTps: 80,   desc: 'Ancient trees, endless undergrowth.' },
  { id: 'alpine',   icon: '🏔️', name: 'Alpine Meadow',  baseCost: 150000,baseTps: 400,  desc: 'High altitude grasslands above the clouds.' },
  { id: 'prairie',  icon: '🌍', name: 'Endless Prairie',baseCost: 1e6,   baseTps: 2000, desc: 'Touch grass at continental scale.' },
];

// ─── Skills (upgrades) ────────────────────────────────────────────────────────
const SKILLS = [
  // Click bonuses
  { id: 'bare_feet',    name: 'Bare Feet',         type: 'click',  value: 1,    maxLevel: 10, baseCost: 15,     costScale: 3,   icon: '🦶', desc: '+1 grass per touch' },
  { id: 'good_shoes',   name: 'Trail Runners',     type: 'click',  value: 5,    maxLevel: 8,  baseCost: 500,    costScale: 4,   icon: '👟', desc: '+5 grass per touch' },
  { id: 'hiking_boots', name: 'Hiking Boots',      type: 'click',  value: 20,   maxLevel: 6,  baseCost: 10000,  costScale: 5,   icon: '🥾', desc: '+20 grass per touch' },
  { id: 'speed_walk',   name: 'Speed Walker',      type: 'click',  value: 100,  maxLevel: 5,  baseCost: 500000, costScale: 6,   icon: '🏃', desc: '+100 grass per touch' },
  // Global multipliers
  { id: 'sunscreen',    name: 'Sunscreen',         type: 'global', value: 1.5,  maxLevel: 5,  baseCost: 200,    costScale: 8,   icon: '☀️', desc: '×1.5 everything' },
  { id: 'vitamin_d',    name: 'Vitamin D',         type: 'global', value: 2,    maxLevel: 4,  baseCost: 25000,  costScale: 10,  icon: '💊', desc: '×2 everything' },
  { id: 'post_rain',    name: 'Post-Rain Grass',   type: 'global', value: 3,    maxLevel: 3,  baseCost: 2e6,    costScale: 15,  icon: '🌧️', desc: '×3 everything' },
  // Location multipliers
  { id: 'green_thumb',  name: 'Green Thumb',       type: 'loc',    value: 1.5,  maxLevel: 5,  baseCost: 1000,   costScale: 8,   icon: '🌱', desc: '×1.5 grass/sec' },
  { id: 'lucky_clover', name: 'Lucky Clover',      type: 'loc',    value: 2,    maxLevel: 4,  baseCost: 50000,  costScale: 10,  icon: '🍀', desc: '×2 grass/sec' },
];

// ─── Milestones ───────────────────────────────────────────────────────────────
const MILESTONES = [
  { at: 100,   msg: '🌱 100 grass touched. You went outside!' },
  { at: 1000,  msg: '🌿 1,000 touches. Skill issue resolved.' },
  { at: 10000, msg: '🌾 10,000! You are one with the lawn.' },
  { at: 1e5,   msg: '🌲 100k! Certified outdoors person.' },
  { at: 1e6,   msg: '🏔️ 1 million! Transcendent grass toucher.' },
  { at: 1e8,   msg: '🌍 100 million! The earth knows your name.' },
  { at: 1e10,  msg: '🌌 10 billion! Cosmic grass energy.' },
];
let nextMilestone = 0;

// ─── Helpers ──────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n / 1e9).toFixed(2)  + 'B';
  if (n >= 1e6)  return (n / 1e6).toFixed(2)  + 'M';
  if (n >= 1e3)  return (n / 1e3).toFixed(1)  + 'k';
  return Math.floor(n).toString();
}

function locationCost(loc, owned) {
  return Math.ceil(loc.baseCost * Math.pow(1.15, owned));
}

function skillCost(sk, level) {
  return Math.ceil(sk.baseCost * Math.pow(sk.costScale, level));
}

function computeLocMult() {
  let m = 1;
  for (const sk of SKILLS.filter(s => s.type === 'loc')) {
    m *= Math.pow(sk.value, state.upgrades[sk.id] || 0);
  }
  return m;
}

function computeTps() {
  let tps = 0;
  for (const loc of LOCATIONS) {
    tps += loc.baseTps * (state.buildings[loc.id] || 0);
  }
  return tps * computeLocMult() * state.globalMult;
}

function computeClickValue() {
  return (1 + state.clickBonus) * state.globalMult;
}

function recomputeGlobalMult() {
  let m = 1;
  for (const sk of SKILLS.filter(s => s.type === 'global')) {
    m *= Math.pow(sk.value, state.upgrades[sk.id] || 0);
  }
  state.globalMult = m;
}

function recomputeClickBonus() {
  let b = 0;
  for (const sk of SKILLS.filter(s => s.type === 'click')) {
    b += sk.value * (state.upgrades[sk.id] || 0);
  }
  state.clickBonus = b;
}

// ─── Rendering ────────────────────────────────────────────────────────────────
function renderHeader() {
  document.getElementById('hdr-grass').textContent = fmt(state.grass);
  document.getElementById('hdr-total').textContent = fmt(state.totalGrass);
  document.getElementById('hdr-tps').textContent   = fmt(computeTps());
  document.getElementById('hdr-tpc').textContent   = fmt(computeClickValue());
}

function renderStats() {
  document.getElementById('m-bonus').textContent  = '+' + fmt(state.clickBonus);
  document.getElementById('m-global').textContent = '×' + state.globalMult.toFixed(2);
  document.getElementById('m-loc').textContent    = '×' + computeLocMult().toFixed(2);
  document.getElementById('m-tps').textContent    = fmt(computeTps()) + '/s';
}

function renderLocations() {
  const panel = document.getElementById('tab-locations');
  panel.innerHTML = '';
  const locMult = computeLocMult();

  for (const loc of LOCATIONS) {
    const owned = state.buildings[loc.id] || 0;
    const cost  = locationCost(loc, owned);
    const can   = state.grass >= cost;
    const thisTps = (loc.baseTps * owned * locMult * state.globalMult).toFixed(1);

    const card = document.createElement('div');
    card.className = 'location-card' + (can ? ' affordable' : '');
    card.innerHTML = `
      <div class="loc-icon">${loc.icon}</div>
      <div class="loc-info">
        <div class="name">${loc.name}</div>
        <div class="desc">${loc.desc}</div>
        <div class="owned">Owned: ${owned} &nbsp;·&nbsp; <span class="tps">${thisTps} grass/sec</span></div>
      </div>
      <button class="loc-buy" ${can ? '' : 'disabled'} data-id="${loc.id}">
        🌿 ${fmt(cost)}
      </button>`;
    panel.appendChild(card);
  }

  panel.querySelectorAll('.loc-buy[data-id]').forEach(btn => {
    btn.addEventListener('click', () => buyLocation(btn.dataset.id));
  });
}

function renderSkills() {
  const grid = document.getElementById('skills-grid');
  grid.innerHTML = '';

  for (const sk of SKILLS) {
    const lvl   = state.upgrades[sk.id] || 0;
    const cost  = skillCost(sk, lvl);
    const maxed = lvl >= sk.maxLevel;
    const can   = !maxed && state.grass >= cost;

    const pips = Array.from({ length: sk.maxLevel }, (_, i) =>
      `<div class="pip${i < lvl ? ' filled' : ''}"></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = 'skill-card' + (maxed ? ' maxed' : can ? ' affordable' : '');
    card.innerHTML = `
      <div class="skill-top">
        <div class="skill-icon">${sk.icon}</div>
        <div class="skill-name">${sk.name}</div>
      </div>
      <div class="skill-desc">${sk.desc}</div>
      <div class="skill-pip-row">${pips}</div>
      <div class="skill-level">Lv ${lvl}/${sk.maxLevel}${maxed ? ' — MAXED' : ''}</div>
      <button class="skill-btn" ${maxed || !can ? 'disabled' : ''} data-id="${sk.id}">
        ${maxed ? 'Maxed' : '🌿 ' + fmt(cost)}
      </button>`;
    grid.appendChild(card);
  }

  grid.querySelectorAll('.skill-btn[data-id]').forEach(btn => {
    btn.addEventListener('click', () => buySkill(btn.dataset.id));
  });
}

function render() {
  renderHeader();
  renderStats();
  renderLocations();
  renderSkills();
}

function updateAffordability() {
  document.querySelectorAll('.loc-buy[data-id]').forEach(btn => {
    const loc  = LOCATIONS.find(l => l.id === btn.dataset.id);
    const cost = locationCost(loc, state.buildings[loc.id] || 0);
    btn.disabled = state.grass < cost;
    btn.closest('.location-card').classList.toggle('affordable', state.grass >= cost);
  });
  document.querySelectorAll('.skill-btn[data-id]').forEach(btn => {
    const sk   = SKILLS.find(s => s.id === btn.dataset.id);
    const lvl  = state.upgrades[sk.id] || 0;
    const cost = skillCost(sk, lvl);
    const maxed = lvl >= sk.maxLevel;
    btn.disabled = maxed || state.grass < cost;
    btn.closest('.skill-card').classList.toggle('affordable', !maxed && state.grass >= cost);
  });
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function earn(amount) {
  state.grass += amount;
  state.totalGrass += amount;
  checkMilestones();
}

function buyLocation(id) {
  const loc   = LOCATIONS.find(l => l.id === id);
  const owned = state.buildings[id] || 0;
  const cost  = locationCost(loc, owned);
  if (state.grass < cost) return;
  state.grass -= cost;
  state.buildings[id] = owned + 1;
  render();
}

function buySkill(id) {
  const sk  = SKILLS.find(s => s.id === id);
  const lvl = state.upgrades[id] || 0;
  if (lvl >= sk.maxLevel) return;
  const cost = skillCost(sk, lvl);
  if (state.grass < cost) return;
  state.grass -= cost;
  state.upgrades[id] = lvl + 1;
  recomputeGlobalMult();
  recomputeClickBonus();
  render();
}

// ─── Click handler ────────────────────────────────────────────────────────────
const touchBtn = document.getElementById('touch-btn');
touchBtn.addEventListener('click', (e) => {
  const val = computeClickValue();
  earn(val);

  touchBtn.classList.remove('squish');
  void touchBtn.offsetWidth;
  touchBtn.classList.add('squish');

  const float = document.createElement('div');
  float.className = 'float';
  float.textContent = '+' + fmt(val) + ' 🌿';
  float.style.left = (e.clientX - 24) + 'px';
  float.style.top  = (e.clientY - 14) + 'px';
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 900);

  renderHeader();
  renderStats();
  updateAffordability();
});

// ─── Tab switching ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ─── Milestones ───────────────────────────────────────────────────────────────
function checkMilestones() {
  while (nextMilestone < MILESTONES.length &&
         state.totalGrass >= MILESTONES[nextMilestone].at) {
    showToast(MILESTONES[nextMilestone].msg);
    nextMilestone++;
  }
}

function showToast(msg) {
  const toast = document.getElementById('milestone-toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 3500);
}

// ─── Grass blade particles ────────────────────────────────────────────────────
const grassDebt = {};
const GRASS_ICONS = ['🌿', '🌱', '🌾'];
const MAX_PARTICLES = 60;

function spawnGrassFromLocation(id) {
  if (document.querySelectorAll('.grass-particle').length >= MAX_PARTICLES) return;
  const btn = document.querySelector(`.loc-buy[data-id="${id}"]`);
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'grass-particle';
  el.textContent = GRASS_ICONS[Math.floor(Math.random() * GRASS_ICONS.length)];
  el.style.left = (rect.left + rect.width  / 2 - 8) + 'px';
  el.style.top  = (rect.top  + rect.height / 2 - 8) + 'px';
  el.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
  el.style.setProperty('--spin',  (Math.random() * 60 - 30) + 'deg');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// ─── Game loop ────────────────────────────────────────────────────────────────
let lastTick = performance.now();

function tick(now) {
  const dt  = Math.min((now - lastTick) / 1000, 1);
  lastTick  = now;
  const tps = computeTps();

  if (tps > 0) {
    earn(tps * dt);
    renderHeader();
    renderStats();
    updateAffordability();
  }

  const locMult = computeLocMult();
  for (const loc of LOCATIONS) {
    const owned = state.buildings[loc.id] || 0;
    if (owned === 0) continue;
    const bTps = loc.baseTps * owned * locMult * state.globalMult;
    grassDebt[loc.id] = (grassDebt[loc.id] || 0) + bTps * dt;
    const toSpawn = Math.min(Math.floor(grassDebt[loc.id]), 5);
    grassDebt[loc.id] -= toSpawn;
    for (let i = 0; i < toSpawn; i++) spawnGrassFromLocation(loc.id);
  }

  requestAnimationFrame(tick);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
requestAnimationFrame(tick);
</script>
</body>
